<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice AI Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #212121; color: #ececec; display: flex; flex-direction: column; height: 100vh; }

    header { padding: 16px 24px; border-bottom: 1px solid #2f2f2f; display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 1.1rem; font-weight: 600; color: #ffffff; }
    .status { font-size: 0.85rem; color: #9b9b9b; }

    #chat-container { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 18px; max-width: 800px; width: 100%; margin: 0 auto; }
    .welcome { text-align: center; margin: auto; color: #9b9b9b; }
    .welcome h2 { color: #ffffff; font-size: 1.6rem; margin-bottom: 8px; }

    .message { max-width: 80%; padding: 12px 16px; border-radius: 18px; line-height: 1.5; font-size: 0.95rem; animation: fadeIn 0.2s ease-in; }
    .user-msg { align-self: flex-end; background-color: #2f2f2f; color: #ffffff; border-bottom-right-radius: 4px; }
    .ai-msg { align-self: flex-start; background-color: transparent; color: #ececec; border: 1px solid #383838; border-bottom-left-radius: 4px; }

    .controls { padding: 20px; background-color: #212121; border-top: 1px solid #2f2f2f; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    #mic-btn { width: 64px; height: 64px; border-radius: 50%; border: none; background-color: #ffffff; color: #212121; font-size: 1.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.15s ease, background-color 0.2s ease; box-shadow: 0 4px 14px rgba(0,0,0,0.4); }
    #mic-btn:hover { transform: scale(1.06); }
    #mic-btn.recording { background-color: #ef4444; color: #ffffff; animation: pulse 1.2s infinite; }
    #mic-hint { font-size: 0.85rem; color: #9b9b9b; }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
      70% { box-shadow: 0 0 0 18px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <header>
    <h1>Voice AI Assistant</h1>
    <span class="status" id="status-text">Ready</span>
  </header>

  <main id="chat-container">
    <div class="welcome" id="welcome-screen">
      <h2>What can I help with?</h2>
      <p>Tap the microphone, speak your question, and tap again to send.</p>
    </div>
  </main>

  <footer class="controls">
    <button id="mic-btn" title="Click to start/stop recording">🎤</button>
    <span id="mic-hint">Click to speak</span>
  </footer>

  <script>
    const micBtn = document.getElementById("mic-btn");
    const micHint = document.getElementById("mic-hint");
    const statusText = document.getElementById("status-text");
    const chatContainer = document.getElementById("chat-container");
    const welcomeScreen = document.getElementById("welcome-screen");

    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    function addMessage(text, className) {
      if (welcomeScreen) welcomeScreen.style.display = "none";
      const div = document.createElement("div");
      div.className = `message ${className}`;
      div.textContent = text;
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return div;
    }

    micBtn.addEventListener("click", async () => {
      if (!isRecording) {
        // Start recording
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
          mediaRecorder.onstop = sendAudioToBackend;

          mediaRecorder.start();
          isRecording = true;
          micBtn.classList.add("recording");
          micBtn.textContent = "⏹";
          micHint.textContent = "Listening... Click to stop & send";
          statusText.textContent = "Recording...";
        } catch (err) {
          alert("Microphone access denied. Please allow mic permissions in your browser.");
        }
      } else {
        // Stop recording -> triggers onstop -> auto-submits
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
        isRecording = false;
        micBtn.classList.remove("recording");
        micBtn.textContent = "🎤";
        micHint.textContent = "Thinking...";
        statusText.textContent = "Processing...";
      }
    });

    async function sendAudioToBackend() {
      const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
      const formData = new FormData();
      formData.append("audio", audioBlob, "recording.webm");

      const thinkingBubble = addMessage("Transcribing & thinking...", "ai-msg");

      try {
        const response = await fetch("/api/voice", {
          method: "POST",
          body: formData
        });
        const data = await response.json();

        thinkingBubble.remove();

        if (data.user_text) {
          addMessage(data.user_text, "user-msg");
        }
        addMessage(data.ai_reply, "ai-msg");

        if (data.audio_base64) {
          const audio = new Audio("data:audio/mp3;base64," + data.audio_base64);
          audio.play();
        }
      } catch (err) {
        thinkingBubble.textContent = "Error connecting to server.";
      } finally {
        micHint.textContent = "Click to speak";
        statusText.textContent = "Ready";
      }
    }
  </script>
</body>
</html>
